name: Windows release
on:
  push:
    branches: [main]
    paths: ['*.cs', 'build.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        shell: pwsh
        run: |
          ./build.ps1
          $p = Start-Process ./dist/ClassInk.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ClassInk-Windows
          path: dist/ClassInk.exe
      - name: Publish v1.7.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.7.1 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.7.1 --target $env:GITHUB_SHA --title 'ClassInk v1.7.1 · C++ 默认模板' --notes '代码块默认使用 C++ 和标准课堂模板，更新图文 README。保留 Alt+1 截图贴图、便笺、黑白代码卡片和 Ctrl+滚轮缩放。' --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v1.7.1 ./dist/ClassInk.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

