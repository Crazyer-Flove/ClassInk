name: Windows release
on:
  push:
    branches: [main]
    paths: ['*.cs', 'build.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        shell: pwsh
        run: |
          ./build.ps1
          $p = Start-Process ./dist/ClassInk.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ClassInk-Windows
          path: dist/ClassInk.exe
      - name: Publish v1.7.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.7.0 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.7.0 --target $env:GITHUB_SHA --title 'ClassInk v1.7.0 · 课堂创作工具' --notes '新增文本便笺、单栏代码编辑与图片导出；便笺、代码块和抽奖合并工具组。支持 Ctrl+滚轮缩放显示、黑白代码主题。详细图文说明见 README，macOS 预览版保持不变。' --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v1.7.0 ./dist/ClassInk.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

