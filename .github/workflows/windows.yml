name: Windows release
on:
  push:
    branches: [main]
    paths: ['ClassInk.cs', 'build.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        shell: pwsh
        run: |
          ./build.ps1
          $p = Start-Process ./dist/ClassInk.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ClassInk-Windows
          path: dist/ClassInk.exe
      - name: Publish v1.6.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.6.0 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.6.0 --target $env:GITHUB_SHA --title 'ClassInk v1.6.0 · 局部毛玻璃放大镜' --notes 'Windows 修复缩放平移与滚轮缩放，新增独立毛玻璃放大镜、五档尺寸和左右切换，默认第 3 档。macOS 预览版保持不变。' --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v1.6.0 ./dist/ClassInk.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
