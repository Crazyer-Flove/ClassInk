name: macOS preview installer
on:
  push:
    branches: [main]
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassInk-macOS
          path: dist/ClassInk-macOS.dmg
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClassInk-macOS
      - shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" ClassInk-macOS.dmg --clobber --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            sleep 10
          done
          echo "Release $TAG not found" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || 'v1.7.1' }}
