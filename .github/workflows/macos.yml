name: macOS preview installer
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassInk-macOS
          path: dist/ClassInk-macOS.dmg
  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClassInk-macOS
      - run: gh release upload "$TAG" ClassInk-macOS.dmg --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
